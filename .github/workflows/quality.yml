name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Unit and contract tests
        run: python -m unittest discover -s tests -v
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy app.py engine tests
      - name: Validate secret-free release build
        run: python package_release.py
